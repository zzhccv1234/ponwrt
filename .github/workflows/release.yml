name: Release PonWrt
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: release
    strategy:
      fail-fast: false
      matrix:
        target:
          - an7581
          - an7583
    steps:
      - uses: actions/checkout@v6
      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ matrix.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-${{ matrix.target }}-
      - name: Fetch extra luci packages
        run: |
          mkdir -p /tmp/myfeeds
          # airoha-npu 仓库布局混乱：根目录和嵌套的 luci-app-airoha-npu/ 子目录各有一份 Makefile，
          # 嵌套那份的 include 路径是坏的。整目录放进 feed 会让该包无法生成 kconfig 条目（.config 里完全没符号）。
          # 只取根目录规范的 Makefile（include feeds/luci/luci.mk）和 htdocs/root/po，构造干净包目录
          git clone https://github.com/rchen14b/luci-app-airoha-npu.git /tmp/npu_tmp
          mkdir -p /tmp/myfeeds/luci-app-airoha-npu
          cp /tmp/npu_tmp/Makefile /tmp/myfeeds/luci-app-airoha-npu/
          cp -R /tmp/npu_tmp/htdocs /tmp/npu_tmp/root /tmp/myfeeds/luci-app-airoha-npu/
          chmod +x /tmp/myfeeds/luci-app-airoha-npu/root/usr/libexec/rpcd/luci.airoha_npu
          # 上游只提供西班牙语 po、无简体中文。这里注入 zh-cn 翻译，
          # 以生成 luci-i18n-airoha-npu-zh-cn 语言包
          mkdir -p /tmp/myfeeds/luci-app-airoha-npu/po/zh-cn
          cat > /tmp/myfeeds/luci-app-airoha-npu/po/zh-cn/luci-app-airoha-npu.po <<'POEOF'
          msgid ""
          msgstr ""
          "Project-Id-Version: 1.0.1\n"
          "PO-Revision-Date: 2026-10-07\n"
          "Last-Translator: Doubao\n"
          "Language-Team: Chinese (Simplified)\n"
          "Language: zh-cn\n"
          "MIME-Version: 1.0\n"
          "Content-Type: text/plain; charset=UTF-8\n"
          "Content-Transfer-Encoding: 8bit\n"
          "Plural-Forms: nplurals=1; plural=0;\n"
          msgid "%d MHz is above %d MHz, which is as far as this has been tested. The board may run unstable or stop responding until it is power cycled."
          msgstr "%d MHz 已超过已测试的上限 %d MHz，设备可能运行不稳定或失去响应，需重新上电才能恢复。"
          msgid "%d sta"
          msgstr "%d 个终端"
          msgid "%d used / %d free (%s%%)"
          msgstr "已用 %d / 空闲 %d（%s%%）"
          msgid "%s (%d regions)"
          msgstr "%s（%d 个区域）"
          msgid "%s | %s | %d cores"
          msgstr "%s | %s | %d 核"
          msgid "8x RISC-V via PCIe RAM"
          msgstr "8 核 RISC-V，经 PCIe 访问内存"
          msgid "Active"
          msgstr "活动"
          msgid "Active (%s)"
          msgstr "活动（%s）"
          msgid "Airoha SoC Status"
          msgstr "Airoha 芯片状态"
          msgid "Apply"
          msgstr "应用"
          msgid "Applying..."
          msgstr "正在应用..."
          msgid "Band %d"
          msgstr "频段 %d"
          msgid "Bound"
          msgstr "已绑定"
          msgid "CPU Cores"
          msgstr "CPU 核心"
          msgid "CPU DMA 1"
          msgstr "CPU DMA 1"
          msgid "CPU DMA 2"
          msgstr "CPU DMA 2"
          msgid "CPU Frequency"
          msgstr "CPU 频率"
          msgid "CPU set to %d MHz"
          msgstr "CPU 已设为 %d MHz"
          msgid "CPU: %s"
          msgstr "CPU：%s"
          msgid "Cancel"
          msgstr "取消"
          msgid "Confirm overclock"
          msgstr "确认超频"
          msgid "Continue"
          msgstr "继续"
          msgid "Could not set the governor: %s"
          msgstr "无法设置调度策略：%s"
          msgid "Could not set the maximum frequency: %s"
          msgstr "无法设置最大频率：%s"
          msgid "Current Frequency"
          msgstr "当前频率"
          msgid "Direct PLL write, %d-%d MHz. Tested up to %d MHz."
          msgstr "直接写入 PLL，%d-%d MHz，已测试至 %d MHz。"
          msgid "Drop %s"
          msgstr "丢弃 %s"
          msgid "Error: %s"
          msgstr "错误：%s"
          msgid "Ethernet"
          msgstr "以太网"
          msgid "Failed: %s"
          msgstr "失败：%s"
          msgid "Fair"
          msgstr "一般"
          msgid "Firmware / Clock / Cores"
          msgstr "固件 / 时钟 / 核心"
          msgid "Frame Engine"
          msgstr "帧引擎"
          msgid "Good"
          msgstr "良好"
          msgid "Governor"
          msgstr "调度策略"
          msgid "Grant access to Airoha SoC status (NPU + CPU + Overclock)"
          msgstr "授予访问 Airoha 芯片状态（NPU + CPU + 超频）"
          msgid "HW Offload: %s%%"
          msgstr "硬件卸载：%s%%"
          msgid "HWF: %s"
          msgstr "帧引擎：%s"
          msgid "Idle"
          msgstr "空闲"
          msgid "Index"
          msgstr "索引"
          msgid "Internal Switch (1G LAN3/4)"
          msgstr "内置交换机（1G LAN3/4）"
          msgid "LAN2 (USXGMII 10G)"
          msgstr "LAN2（USXGMII 10G）"
          msgid "Manages:"
          msgstr "管理："
          msgid "Max Frequency"
          msgstr "最大频率"
          msgid "N/A"
          msgstr "不可用"
          msgid "NPU & Offload Engine"
          msgstr "NPU 与卸载引擎"
          msgid "NPU Status"
          msgstr "NPU 状态"
          msgid "New Flow"
          msgstr "新建流"
          msgid "No clients"
          msgstr "无客户端"
          msgid "Not Active"
          msgstr "未活动"
          msgid "Not available: unrecognised SoC"
          msgstr "不可用：无法识别的芯片"
          msgid "Off"
          msgstr "关闭"
          msgid "Original Flow"
          msgstr "原始流"
          msgid "Overclock"
          msgstr "超频"
          msgid "Overclock request failed: %s"
          msgstr "超频请求失败：%s"
          msgid "P7 WiFi DMA"
          msgstr "P7 WiFi DMA"
          msgid "PPE Engines"
          msgstr "PPE 引擎"
          msgid "PPE Flow Offload Entries"
          msgstr "PPE 流卸载表项"
          msgid "PPE init, WDMA rings, flow stats"
          msgstr "PPE 初始化、WDMA 环、流统计"
          msgid "PSE Port Queue Status"
          msgstr "PSE 端口队列状态"
          msgid "PSE Shared Buffer"
          msgstr "PSE 共享缓存"
          msgid "Poor"
          msgstr "较差"
          msgid "RX"
          msgstr "接收"
          msgid "RX Drop"
          msgstr "接收丢弃"
          msgid "Reserved Memory"
          msgstr "预留内存"
          msgid "SoC"
          msgstr "芯片"
          msgid "SoC Status"
          msgstr "芯片状态"
          msgid "State"
          msgstr "状态"
          msgid "TX"
          msgstr "发送"
          msgid "TX Drop"
          msgstr "发送丢弃"
          msgid "TX: %s"
          msgstr "发送：%s"
          msgid "The frequency must be between %d and %d MHz"
          msgstr "频率必须在 %d 到 %d MHz 之间"
          msgid "Total"
          msgstr "总计"
          msgid "Type"
          msgstr "类型"
          msgid "Unknown"
          msgstr "未知"
          msgid "WAN (USXGMII 10G)"
          msgstr "WAN（USXGMII 10G）"
          msgid "devmem is not available on this build"
          msgstr "本固件未提供 devmem"
          POEOF
          git clone https://github.com/gdy666/luci-app-lucky.git /tmp/myfeeds/luci-app-lucky
      - name: Setup custom feed
        run: |
          # 必须先基于默认源创建 feeds.conf，否则直接 >> 会生成只含自定义源的文件，
          # 导致 luci/packages/pon_userspace 等标准 feed 全部丢失
          cp feeds.conf.default feeds.conf
          echo "src-link myextra /tmp/myfeeds" >> feeds.conf
      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          fi
      - name: Configure ${{ matrix.target }}
        run: |
          cp "configs/${{ matrix.target }}.config" tmp_target.config
          cat >> tmp_target.config <<'EOF'
          CONFIG_PACKAGE_luci-app-airoha-npu=y
          CONFIG_PACKAGE_luci-i18n-airoha-npu-zh-cn=y
          CONFIG_PACKAGE_lucky=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_luci-i18n-lucky-zh-cn=y
          EOF
          ./scripts/kconfig.pl + \
            tmp_target.config \
            configs/release.config > .config
          make defconfig
          grep -E "airoha-npu|lucky" .config
      - name: Download sources
        run: make download -j"$(nproc)"
      - name: Build ${{ matrix.target }}
        run: |
          set -o pipefail
          if ! make -j"$(nproc)" V=s 2>&1 | tee build-full.log; then
            echo "==================== ERROR SUMMARY ===================="
            grep -nE "Error [0-9]+|error:|fatal error|No such file|cannot |too big|too large|Hunk #|undefined reference|failed to build" build-full.log | head -50
            echo "==================== ERROR CONTEXT ===================="
            grep -n -B25 -A8 "target/linux failed" build-full.log | head -140
            exit 1
          fi
      - name: Show build errors
        if: failure()
        run: |
          echo "===== FATAL ERRORS ====="
          grep -nE "Error [0-9]+|fatal error|No such file|cannot (find|stat|access)|too big|too large|failed to build|Hunk #.*FAILED|undefined reference" build-full.log | grep -viE "warning:|: note:" | tail -60
          echo "===== TARGET/LINUX FAIL CONTEXT ====="
          grep -n -B35 -A12 "target/linux failed" build-full.log | tail -180
      - name: Pack ${{ matrix.target }}
        run: |
          mkdir release
          tar --zstd -cf "release/ponwrt-${{ matrix.target }}.tar.zst" \
            -C bin/targets/airoha "${{ matrix.target }}"
      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ matrix.target }}
          path: release/*.tar.zst
          if-no-files-found: error
          retention-days: 7
  release:
    name: Create release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware archives
        uses: actions/download-artifact@v4
        with:
          pattern: ponwrt-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum *.tar.zst > sha256sums
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            release/*.tar.zst
            release/sha256sums
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "PonWrt $RELEASE_TAG"
            --generate-notes
          )
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
