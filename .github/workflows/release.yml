name: Release PonWrt
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: release
    strategy:
      fail-fast: false
      matrix:
        target:
          - an7581
          - an7583
    steps:
      - uses: actions/checkout@v6
      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ matrix.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-${{ matrix.target }}-
      - name: Fetch extra luci packages
        run: |
          mkdir -p /tmp/myfeeds
          # airoha-npu 使用 luanmuc 维护的分支：自带简体中文 po/zh_Hans，且无嵌套坏目录。
          # 仍只取规范的 Makefile + htdocs/root/po 构造干净包目录（排除 screenshots 等无关文件）
          git clone https://github.com/luanmuc/luci-app-airoha-npu.git /tmp/npu_tmp
          mkdir -p /tmp/myfeeds/luci-app-airoha-npu
          cp /tmp/npu_tmp/Makefile /tmp/myfeeds/luci-app-airoha-npu/
          cp -R /tmp/npu_tmp/htdocs /tmp/npu_tmp/root /tmp/npu_tmp/po /tmp/myfeeds/luci-app-airoha-npu/
          chmod +x /tmp/myfeeds/luci-app-airoha-npu/root/usr/libexec/rpcd/luci.airoha_npu
          # 去掉 @TARGET_airoha 条件（本固件只给 airoha 编译，该守卫多余），排除任何可见性风险
          sed -i 's/ @TARGET_airoha//' /tmp/myfeeds/luci-app-airoha-npu/Makefile
          # po/zh_Hans 由 luci.mk 经别名 zh_Hans->zh-cn 生成 luci-i18n-airoha-npu-zh-cn
          git clone https://github.com/gdy666/luci-app-lucky.git /tmp/myfeeds/luci-app-lucky
      - name: Setup custom feed
        run: |
          # 必须先基于默认源创建 feeds.conf，否则直接 >> 会生成只含自定义源的文件，
          # 导致 luci/packages/pon_userspace 等标准 feed 全部丢失
          cp feeds.conf.default feeds.conf
          echo "src-link myextra /tmp/myfeeds" >> feeds.conf
      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          fi
      - name: Configure ${{ matrix.target }}
        run: |
          cp "configs/${{ matrix.target }}.config" tmp_target.config
          cat >> tmp_target.config <<'EOF'
          CONFIG_PACKAGE_luci-app-airoha-npu=y
          CONFIG_PACKAGE_luci-i18n-airoha-npu-zh-cn=y
          CONFIG_PACKAGE_lucky=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_luci-i18n-lucky-zh-cn=y
          EOF
          ./scripts/kconfig.pl + \
            tmp_target.config \
            configs/release.config > .config
          make defconfig
          grep -E "airoha-npu|lucky" .config
      - name: Download sources
        run: make download -j"$(nproc)"
      - name: Build ${{ matrix.target }}
        run: |
          set -o pipefail
          if ! make -j"$(nproc)" V=s 2>&1 | tee build-full.log; then
            echo "==================== ERROR SUMMARY ===================="
            grep -nE "Error [0-9]+|error:|fatal error|No such file|cannot |too big|too large|Hunk #|undefined reference|failed to build" build-full.log | head -50
            echo "==================== ERROR CONTEXT ===================="
            grep -n -B25 -A8 "target/linux failed" build-full.log | head -140
            exit 1
          fi
      - name: Show build errors
        if: failure()
        run: |
          echo "===== FATAL ERRORS ====="
          grep -nE "Error [0-9]+|fatal error|No such file|cannot (find|stat|access)|too big|too large|failed to build|Hunk #.*FAILED|undefined reference" build-full.log | grep -viE "warning:|: note:" | tail -60
          echo "===== TARGET/LINUX FAIL CONTEXT ====="
          grep -n -B35 -A12 "target/linux failed" build-full.log | tail -180
      - name: Pack ${{ matrix.target }}
        run: |
          mkdir release
          tar --zstd -cf "release/ponwrt-${{ matrix.target }}.tar.zst" \
            -C bin/targets/airoha "${{ matrix.target }}"
      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ matrix.target }}
          path: release/*.tar.zst
          if-no-files-found: error
          retention-days: 7
  release:
    name: Create release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware archives
        uses: actions/download-artifact@v4
        with:
          pattern: ponwrt-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum *.tar.zst > sha256sums
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            release/*.tar.zst
            release/sha256sums
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "PonWrt $RELEASE_TAG"
            --generate-notes
          )
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
